name: Update Git Runner

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "git_runner/**"
      - "requirements.txt"
      - ".github/workflows/runner.yml"

permissions:
  contents: write

concurrency:
  group: update-git-runner
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install renderer
        run: python -m pip install -r requirements.txt
      - name: Check activity and renderer
        run: python -m unittest discover -s tests -v
      - name: Draw the repository owner's runner
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_LOGIN: abhishekbaloria
          RUNNER_DISPLAY_NAME: Abhishek
          RUNNER_REPOSITORY: ${{ github.event.repository.name }}
        run: >-
          python -m git_runner --username "$RUNNER_LOGIN"
          --name "$RUNNER_DISPLAY_NAME" --exclude-repository "$RUNNER_REPOSITORY"
          --output generated
      - name: Commit changed artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/runner.gif generated/runner.png generated/activity.json generated/preview.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Git Runner [skip ci]"
          git pull --rebase
          git push

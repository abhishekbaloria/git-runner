[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-runner-profile"
version = "0.1.0"
description = "An animated pixel runner powered by GitHub contributions"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.3,<14"]

[project.scripts]
git-runner = "git_runner.cli:main"

[tool.setuptools.packages.find]
include = ["git_runner*"]
